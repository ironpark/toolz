<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>CharmTrue</title>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">CT</span><strong>CharmTrue</strong></div>
        <nav aria-label="주 메뉴">
            <button class="nav-item active">Overview</button>
            <button class="nav-item" disabled>Storage</button>
            <button class="nav-item" disabled>Datasets</button>
            <button class="nav-item" disabled>Services</button>
            <button class="nav-item" disabled>System</button>
        </nav>
        <span class="version">v0.1.0 · Wails 3</span>
    </aside>

    <main class="content">
        <header class="topbar">
            <div><span class="eyebrow">TRUENAS MANAGER</span><h1>Overview</h1></div>
            <span class="status"><i></i> Not connected</span>
        </header>

        <section class="empty-state">
            <div class="server-icon">▰</div>
            <h2>Connect your first TrueNAS system</h2>
            <p>Add a server URL and API key to start monitoring pools, datasets, services, and system health.</p>
            <button id="connect" type="button">Add TrueNAS system</button>
            <small id="message" role="status"></small>
        </section>
    </main>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

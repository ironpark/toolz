# planr 테스트 픽스처 목록
#
# 각 픽스처는 서로 다른 실행기가 사용하며, 격리된 작업 디렉터리로 복사된 뒤
# 그 안에서만 수정됩니다. 새 픽스처를 추가하면 이 파일에도 항목을 추가합니다.
# 실행기의 기계 판독 설정(빌드·관찰·신호·완료 판정)은 HARNESS.json에 있습니다.
#
# 에이전트 지침(AGENTS.md)은 픽스처마다 복사하지 않고 agents/<변형>.md 하나만 둡니다.
# 실행기는 --agents <변형>으로 그중 하나를, --prompt <변형>으로 픽스처의
# FIXTURE.PROMPT.<변형>.md 중 하나를 골라 짝지어 실행하므로 요청 문구와 지침 문서를
# 각각 A/B로 비교할 수 있습니다. 둘 다 기본값은 실행 언어와 같은 이름의 변형입니다.
# 사용 가능한 변형은 `main.py codex variants`로 확인합니다.
#
# agents/<변형>.md: 워크스페이스에 AGENTS.md로 설치되는 공용 저장소 지침. 지금은
#   언어별 변형 en·ko가 있고, 새 지침 실험은 여기에 변형을 추가하면 모든 픽스처가 쓸 수
#   있습니다. 특정 픽스처만 다른 지침이 필요하면 그 픽스처에 FIXTURE.AGENTS.<변형>.md를
#   두어 같은 이름의 공용 파일을 덮어씁니다.

fixtures:
  - name: codex-harness
    used_by: cli/planr/scripts/codex.py
    workspace: 시스템 임시 디렉터리 (산출물은 cli/planr/run/<timestamp>-codex/)
    description: >-
      Codex 평가용 샘플 저장소. 에이전트가 실제로 작업할 Go 프로젝트와
      새 JSON/stdin planr workflow를 설명하는 지침 문서를 담고 있으며, 하네스가 이 디렉터리 전체를 격리 작업공간으로
      복사한 뒤 git init을 수행한다.
    contents:
      - .planr.yaml: 훅으로 planr 이벤트를 .harness/planr-events.log에 기록
      - FIXTURE.PROMPT.<변형>.md: 선택한 변형(기본값은 실행 언어)이 에이전트에게 보내는 요청. 워크스페이스로 복사하지 않는다
      - go.mod, main.go, main_test.go: 에이전트가 수정하는 샘플 Go 프로젝트
      - README.md: 샘플 프로젝트 설명

  - name: codex-greenfield
    used_by: cli/planr/scripts/codex.py --fixture codex-greenfield
    workspace: 시스템 임시 디렉터리 (산출물은 cli/planr/run/<timestamp>-codex-greenfield/)
    description: >-
      백지 상태에서 시작하는 Codex 평가. Go 프로젝트가 없어 에이전트가 go.mod부터
      직접 만들어야 하며, 과제는 하위 명령·플래그·JSON 저장소·오류 처리를 갖춘
      할 일 관리 CLI다. codex-harness보다 요구사항이 많아 phase를 나눌 여지가 크다.
    contents:
      - .planr.yaml: 훅으로 planr 이벤트를 .harness/planr-events.log에 기록
      - .gitignore: .harness/, bin/, 빌드된 tasks 바이너리와 tasks.json 제외
      - FIXTURE.PROMPT.<변형>.md: 선택한 변형(기본값은 실행 언어)이 에이전트에게 보내는 요청. 워크스페이스로 복사하지 않는다
      - FIXTURE.TEST.sh: >-
          세션 종료 후 하네스가 워크스페이스 밖에서 실행하는 인수 검사.
          워크스페이스로 복사하지 않으므로 에이전트가 검사 내용을 보고 맞출 수 없다.
          `CHECK<TAB>이름<TAB>PASS|FAIL<TAB>비고` 줄을 출력하면 analyze.py가
          리포트의 "인수 검사" 표로 만든다.

  - name: codex-regex
    used_by: cli/planr/scripts/codex.py --fixture codex-regex
    workspace: 시스템 임시 디렉터리 (산출물은 cli/planr/run/<timestamp>-codex-regex/)
    description: >-
      설명할 기능은 적지만 구현이 깊은 Codex 평가. 명령 표면은 `rx <pattern> <file>`과
      플래그 두 개(-o, -c)뿐이고, 실제 과제는 `. * + ? [] ^ $ | () \`를 지원하는 정규식
      엔진을 직접 만드는 것이다. `regexp` import를 인수 검사가 막으므로 표준 라이브러리
      래핑으로 우회할 수 없다. codex-greenfield가 요구사항 개수로 phase를 나누게 한다면
      이 픽스처는 파서·매처·앵커·오류 처리처럼 구현 난이도로 phase를 나누게 한다.
    contents:
      - .planr.yaml: 훅으로 planr 이벤트를 .harness/planr-events.log에 기록
      - .gitignore: .harness/, bin/, 빌드된 rx 바이너리 제외
      - FIXTURE.PROMPT.<변형>.md: 선택한 변형(기본값은 실행 언어)이 에이전트에게 보내는 요청. 워크스페이스로 복사하지 않는다
      - FIXTURE.TEST.sh: >-
          문법 16종·탐욕 매칭·플래그·종료 코드·잘못된 패턴 5종을 검사하고,
          `regexp` import 여부와 외부 의존성 유무도 함께 본다. 워크스페이스로
          복사하지 않으므로 에이전트가 검사 내용을 보고 맞출 수 없다.

  - name: codex-kvstore
    used_by: cli/planr/scripts/codex.py --fixture codex-kvstore
    workspace: 시스템 임시 디렉터리 (산출물은 cli/planr/run/<timestamp>-codex-kvstore/)
    description: >-
      phase 사이에 불변식이 걸린 Codex 평가. 명령은 set·get·del·list·compact 다섯 개뿐이지만,
      요구는 추가 전용 로그 위의 영속성·잘린 꼬리 복구·원자적 compaction·동시 쓰기다.
      codex-regex가 구현 난이도로 phase를 나누게 한다면 이 픽스처는 뒤 phase에서 앞 phase의
      설계 결함이 드러나게 한다 — compaction 버그는 복구 경로에서, 잠금 누락은 병렬 쓰기에서만
      보인다. 인수 검사는 올바른 참조 구현으로 23/23 통과를, 파일 전체를 다시 쓰는 순진한
      구현으로 5건 실패를 확인해 판별력을 검증했다.
    contents:
      - .planr.yaml: 훅으로 planr 이벤트를 .harness/planr-events.log에 기록
      - .gitignore: .harness/, bin/, 빌드된 kv 바이너리와 *.log 제외
      - FIXTURE.PROMPT.<변형>.md: 선택한 변형(기본값은 실행 언어)이 에이전트에게 보내는 요청. 워크스페이스로 복사하지 않는다
      - FIXTURE.TEST.sh: >-
          기본 동작·종료 코드·영속성 외에 잘린 로그, 쓰레기 꼬리, compaction 전후 상태와 크기,
          200개 시드 위에서 30개씩 3회 병렬 쓰기를 검사한다. 병렬 검사는 경쟁 구간을 넓혀야
          판별되므로 시드를 먼저 쌓는다.

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">toolz</title>
  <desc id="desc">A collection of small, useful command-line tools and agent skills.</desc>
  <defs>
